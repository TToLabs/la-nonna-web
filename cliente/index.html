<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#14204A">
<title>La Nonna Restaurante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lobster&display=swap" rel="stylesheet">

<body>
<div class="app" id="app">
  <div class="splash" id="splash">
    <div class="splash-centro">
      <div id="splash-logo"></div>
      <div class="splash-lema titulo">Comida hogareña</div>
      <div class="avance" id="splash-avance" role="progressbar" aria-label="Cargando el menú" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
    </div>
    <div class="by-logo"><span>by</span><img src="../img/bto-innova.png" alt="BTo Innova, Soluciones"></div>
  </div>
  <header class="top">
    <span id="logo"></span>
    <span class="titulo nom" id="nombre">La Nonna Restaurante</span>
    <span id="estado" class="pill pill-g">…</span>
  </header>
  <main id="vista" aria-live="polite"></main>
  <nav class="tabs" aria-label="Secciones">
    <button data-tab="menu"><svg viewBox="0 0 24 24"><path d="M6 3v8M9 3v8M6 7h3M7.5 11v10M16 3c-2 2-2 6 0 8v10"/></svg>Menú</button>
    <button data-tab="pedido"><svg viewBox="0 0 24 24"><path d="M5 7h14l-1.5 11a2 2 0 0 1-2 1.8H8.5a2 2 0 0 1-2-1.8L5 7zM9 7a3 3 0 0 1 6 0"/></svg>Mi pedido<span class="ins" id="ins" hidden>0</span></button>
    <button data-tab="seguim"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Seguimiento</button>
    <button data-tab="cuenta"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Mi cuenta</button>
  </nav>
</div>
<div class="modal-bg" id="mbg" hidden><div class="modal" id="mod" role="dialog" aria-modal="true"></div></div>
<script src="../demo/demo-api.js"></script>
<script src="../comun/api.js"></script>
<script src="../comun/utilidades.js"></script>
<script src="../vendor/qrcode.js"></script>
<script src="../comun/giro.js"></script>
<script src="../comun/nativo.js"></script>
<script src="cliente.js"></script>
